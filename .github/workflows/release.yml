# Each push to master builds the Windows installer and publishes it as a GitHub Release
# using the version from package.json.
name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release version
        id: ver
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+p.version+'\n'); console.log('version', p.version);"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const version=process.env.VERSION; const tag='v'+version; const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'idf-strike','Content-Type':'application/json'}; fetch('https://api.github.com/repos/B3waR3/IDF-Strike/releases',{method:'POST',headers,body:JSON.stringify({tag_name:tag,name:version,draft:true,target_commitish:process.env.GITHUB_SHA,body:'IDF Strike '+version})}).then(async r=>{const t=await r.text(); if(!r.ok) throw new Error(r.status+' '+t); console.log('draft', tag);}).catch(e=>{console.error(e); process.exit(1);});"
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const version=process.env.VERSION; const tag='v'+version; const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'idf-strike','Content-Type':'application/json'}; fetch('https://api.github.com/repos/B3waR3/IDF-Strike/releases?per_page=20',{headers}).then(r=>r.json()).then(async releases=>{ const matches=releases.filter(r=>r.tag_name===tag); const primary=matches.find(r=>(r.assets||[]).some(a=>a.name.endsWith('.exe'))); if(!primary) throw new Error('installer was not uploaded for '+tag); const pub=await fetch(primary.url,{method:'PATCH',headers,body:JSON.stringify({draft:false,tag_name:tag,name:version,make_latest:'true'})}); const t=await pub.text(); if(!pub.ok) throw new Error(pub.status+' '+t); console.log('published', tag); }).catch(e=>{console.error(e); process.exit(1);});"

# Each push to master builds the Windows installer and publishes it as a GitHub Release.
# The version's patch number is the package version plus this workflow's run number, so every
# push is newer than the last release and installed copies can see the update.
name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release version
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const parts=String(p.version).split('.'); while (parts.length<3) parts.push('0'); parts[2]=String(Number(parts[2])+Number(process.env.RUN_NUMBER)); p.version=parts.join('.'); fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n'); console.log('version', p.version);"
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
